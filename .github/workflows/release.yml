name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-candidate:
    name: Windows release candidate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Run deterministic tests
        run: bash scripts/verify.sh
      - name: Require export presets for release builds
        run: test -f export_presets.cfg
      - name: Export Windows Desktop
        run: |
          mkdir -p build artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Windows Desktop" "build/${slug}.exe"
      - name: Smoke packaged Windows build
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/run_packaged_smoke.py \
            --executable "build/${slug}.exe" \
            --profile-root "${RUNNER_TEMP}/pack-the-keep-smoke" \
            --report-copy artifacts/packaged-smoke.json
      - name: Audit packaged alpha evidence
        run: python tools/validate_p12_alpha.py --report artifacts/packaged-smoke.json
      - name: Create release manifest
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python -c "import json, os; m=json.load(open('tools/ci_manifest.json')); m.update({'commit': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF']}); json.dump(m, open('artifacts/release_manifest.json','w'), indent=2)"
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate-${{ github.ref_name }}
          path: |
            build/
            artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          gh release create "$GITHUB_REF_NAME" \
            "build/${slug}.exe" \
            "artifacts/release_manifest.json" \
            "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pack the Keep ${GITHUB_REF_NAME} Internal" \
            --prerelease \
            --notes "Private internal pre-alpha Windows build. See docs/internal_test_release.md for the test checklist and deliberate production boundaries."
