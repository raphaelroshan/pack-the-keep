name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-candidate:
    name: Windows release candidate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Run deterministic tests
        run: bash scripts/verify.sh
      - name: Require export presets for release builds
        run: test -f export_presets.cfg
      - name: Export Windows Desktop
        run: |
          mkdir -p build artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          godot --headless --path . --import
          godot --headless --path . --export-release "Windows Desktop" "build/${slug}.exe"
      - name: Smoke packaged Windows build
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/run_packaged_smoke.py \
            --executable "build/${slug}.exe" \
            --profile-root "${RUNNER_TEMP}/pack-the-keep-smoke" \
            --report-copy artifacts/packaged-smoke.json
      - name: Audit packaged alpha evidence
        run: python tools/validate_p12_alpha.py --report artifacts/packaged-smoke.json
      - name: Audit K8 packaged private-alpha gate
        run: python tools/validate_k8_private_alpha.py --packaged-report artifacts/packaged-smoke.json
      - name: Record playtest artifact provenance
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/write_playtest_build_manifest.py \
            --executable "build/${slug}.exe" \
            --ci-manifest tools/ci_manifest.json \
            --source-revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --output artifacts/playtest-build.json
      - name: Write packaged playtest observer brief
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/write_playtest_brief.py \
            --protocol content/p16_playtest_protocol.json \
            --build-manifest artifacts/playtest-build.json \
            --artifact "build/${slug}.exe" \
            --output artifacts/PLAYTEST_README.md
      - name: Write unfilled playtest matrix templates
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/write_playtest_matrix_templates.py \
            --protocol content/p16_playtest_protocol.json \
            --build-manifest artifacts/playtest-build.json \
            --artifact "build/${slug}.exe" \
            --output-directory artifacts/playtest-templates
      - name: Stage private-alpha limitations
        run: cp docs/private_alpha_known_limitations.md artifacts/PRIVATE_ALPHA_LIMITATIONS.md
      - name: Create release manifest
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python -c "import json, os; m=json.load(open('tools/ci_manifest.json')); m.update({'commit': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF']}); json.dump(m, open('artifacts/release_manifest.json','w'), indent=2)"
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-candidate-${{ github.ref_name }}
          path: |
            build/
            artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          gh release create "$GITHUB_REF_NAME" \
            "build/${slug}.exe" \
            "artifacts/packaged-smoke.json" \
            "artifacts/playtest-build.json" \
            "artifacts/PLAYTEST_README.md" \
            "artifacts/PRIVATE_ALPHA_LIMITATIONS.md" \
            artifacts/playtest-templates/*.json \
            "artifacts/release_manifest.json" \
            "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pack the Keep ${GITHUB_REF_NAME} Internal" \
            --prerelease \
            --notes "Public pre-alpha Windows test build. See docs/internal_test_release.md for the test checklist and deliberate production boundaries."
